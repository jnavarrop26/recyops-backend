spring:
  application:
    name: recyops-api

  config:
    # Secretos locales de desarrollo; en despliegue no existe y se ignora
    # porque las variables llegan del entorno (dashboard del proveedor).
    import: "optional:file:.env.properties"

  datasource:
    # Pooler de Supabase en modo Session (puerto 5432), proyecto recy-ops.
    # La URL debe llevar ?sslmode=require: el driver JDBC NO cifra por defecto.
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  flyway:
    # Apagada a proposito: la autoconfiguracion de Spring Boot migra UN solo
    # esquema, y aqui cada empresa tiene el suyo. MigradorEsquemas corre Flyway
    # una vez por tenant (historial propio dentro de cada esquema) mas una vez
    # sobre public para el directorio de empresas.
    enabled: false

  jpa:
    # El DDL lo aplica Flyway por esquema (db/migration/tenant), nunca Hibernate
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.format_sql: true

  http:
    client:
      # Sin esto, un RestClient.Builder inyectado no tiene limite: un Supabase
      # Auth colgado agotaria el pool de hilos de Tomcat esperando la respuesta.
      connect-timeout: 3s
      read-timeout: 10s

  security:
    oauth2:
      resourceserver:
        jwt:
          # Claves de firma de Supabase Auth (Authentication > JWT Keys > firma asimetrica).
          # Si el proyecto usa el JWT secret legado (HS256), ver docs/doc-002_esquema-supabase.md.
          jwk-set-uri: ${SUPABASE_URL:https://dggpfcefzalyoyvgjjxu.supabase.co}/auth/v1/.well-known/jwks.json
          # Supabase firma los access token con ES256 (curva P-256)
          jws-algorithms: ES256

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  # Esquema usado cuando el JWT no trae app_metadata.empresa_schema (p. ej. en desarrollo)
  esquema-por-defecto: ${RECYOPS_ESQUEMA_DEFECTO:empresa_demo}

recyops:
  cors:
    # Origen del cliente Vite/Bun en desarrollo
    origenes-permitidos: ${RECYOPS_CORS_ORIGENES:http://localhost:5173}
  auth:
    # Limite de peticiones por IP y por minuto sobre /api/auth/** (anti fuerza bruta)
    max-intentos-por-minuto: ${RECYOPS_AUTH_MAX_INTENTOS:10}
  rate-limit:
    # Limite global por IP y por minuto sobre todo /api/** (contencion basica)
    global-por-minuto: ${RECYOPS_RATE_GLOBAL:120}
    # Solo poner true en produccion detras de un proxy de confianza (Render/Vercel):
    # ahi X-Forwarded-For lo fija el proxy. En acceso directo el cliente lo falsifica,
    # asi que en local/dev se usa la IP real del socket (infalsificable).
    confiar-en-proxy: ${RECYOPS_CONFIAR_PROXY:false}
  migraciones:
    # Corre Flyway al arrancar sobre public y sobre cada esquema de empresa.
    # Apagar donde las migraciones las aplique un job de despliegue aparte.
    al-arrancar: ${RECYOPS_MIGRAR_AL_ARRANCAR:true}
  # En produccion: true -> se rechazan JWT sin claim empresa_schema en lugar de
  # caer al esquema por defecto (evita accesos accidentales entre empresas).
  esquema-estricto: ${RECYOPS_ESQUEMA_ESTRICTO:true}

# Observabilidad: Actuator + Micrometer -> Prometheus -> Grafana (ver monitoreo/)
management:
  server:
    # Puerto separado a proposito: al diferir de server.port, Boot sirve actuator
    # en un ApplicationContext hijo que reprocesa el mismo SecurityConfig (que
    # permitAll-ea /actuator/**). La proteccion real es de red, no de aplicacion:
    # en produccion (Render) solo server.port queda expuesto publicamente, este
    # puerto nunca sale del host.
    # 9091 y no 9090: ese puerto ya lo ocupa el propio contenedor de Prometheus
    # (ver monitoreo/docker-compose.yml), que corre en la maquina host.
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Sin Authentication en el contexto de gestion, "when-authorized" nunca
      # se cumple: el detalle queda oculto siempre. Conservador a proposito.
      show-details: when-authorized
  metrics:
    tags:
      # Todas las metricas llevan el nombre de la app (util con varios servicios)
      application: ${spring.application.name}

server:
  port: 8080
  tomcat:
    # Carpeta de trabajo de Tomcat dentro del proyecto. Evita el error
    # "Unable to create tempDir" cuando java.io.tmpdir apunta a C:\WINDOWS.
    basedir: .tomcat
